services:
  # ==========================================
  # PostgreSQL with pgvector Support
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: interviewprep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: interviewprep_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interviewprep_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis Cache & Broker
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: interviewprep_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Spring Boot Backend (Java 21)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: interviewprep_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/interviewprep_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres_secure_pass
      REDIS_URL: redis://redis:6379
      SERVER_PORT: 8080
      JWT_SECRET: super_secret_jwt_key_that_is_at_least_256_bits_long_for_hmac_sha256_security_production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

  # ==========================================
  # Next.js Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: interviewprep_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      NEXT_PUBLIC_WS_URL: http://localhost:8080/ws
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
